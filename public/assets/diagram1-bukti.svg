<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="t d"><title id="t">Kesenjangan bukti dan data ImpactGrid</title><desc id="d">Konteks korporat resmi terpisah dari data lokasi pilot yang belum tersedia.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1e293b}.title{font-size:25px;font-weight:800}.head{font-size:18px;font-weight:800}.body{font-size:15px}.muted{fill:#64748b}.num{font-size:24px;font-weight:800}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#3b82f6}.amber{fill:#fffbeb;stroke:#f59e0b}.green{fill:#f0fdf4;stroke:#22c55e}</style><text x="40" y="45" class="title">Kesenjangan bukti dan data untuk keputusan efisiensi energi</text><rect x="40" y="95" width="385" height="440" rx="18" class="card blue"/><text x="70" y="140" class="head">Konteks korporat Telkomsel 2025</text><text x="70" y="205" class="num">1.885,4 GWh</text><text x="70" y="235" class="body">Konsumsi listrik perusahaan</text><text x="70" y="300" class="num">1,722 MtCO₂e</text><text x="70" y="330" class="body">Emisi Scope 2 perusahaan</text><text x="70" y="390" class="body muted">Angka resmi perusahaan; bukan</text><text x="70" y="415" class="body muted">baseline atau dampak per lokasi.</text><text x="70" y="485" class="body muted">Laporan keberlanjutan Telkom 2025</text><rect x="475" y="95" width="985" height="125" rx="18" class="card"/><text x="510" y="140" class="head">1. Data lokasi belum tersedia</text><text x="510" y="180" class="body">Meter, tagihan, trafik, kondisi aset, tarif kontrak, dan izin akses perlu dikumpulkan serta direkonsiliasi.</text><rect x="475" y="255" width="475" height="125" rx="18" class="card amber"/><text x="510" y="300" class="head">2. Kelayakan finansial belum pasti</text><text x="510" y="340" class="body">Baseline dan biaya aktual mengubah hasil NPV.</text><rect x="985" y="255" width="475" height="125" rx="18" class="card amber"/><text x="1020" y="300" class="head">3. Keselamatan belum diuji</text><text x="1020" y="340" class="body">QoS, latency, rollback, dan 112 perlu ditetapkan operator.</text><rect x="475" y="415" width="985" height="120" rx="18" class="card green"/><text x="510" y="460" class="head">4. Dampak ESG belum dapat diklaim</text><text x="510" y="500" class="body">Perlu metode, faktor emisi, pembanding, dan bukti yang disetujui tim ESG.</text></svg>