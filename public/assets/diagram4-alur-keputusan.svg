<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="t d"><title id="t">Alur validasi dan keputusan ImpactGrid</title><desc id="d">Pengumpulan bukti, simulasi, tinjauan operator, dan keputusan pilot yang bersyarat.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1e293b}.title{font-size:25px;font-weight:800}.head{font-size:18px;font-weight:800}.body{font-size:15px}.muted{fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#3b82f6}.purple{fill:#faf5ff;stroke:#a855f7}.amber{fill:#fffbeb;stroke:#f59e0b}.green{fill:#f0fdf4;stroke:#22c55e}.red{fill:#fff1f2;stroke:#e11d48}</style><text x="40" y="45" class="title">Alur keputusan yang diusulkan · tiap tahap memerlukan bukti</text><rect x="40" y="110" width="320" height="245" rx="18" class="card blue"/><text x="70" y="155" class="head">1. Validasi data</text><text x="70" y="200" class="body"><tspan x="70" dy="0">Periksa sumber, periode,</tspan><tspan x="70" dy="30">kelengkapan, meter, biaya,</tspan><tspan x="70" dy="30">dan izin akses.</tspan></text><rect x="420" y="110" width="320" height="245" rx="18" class="card purple"/><text x="450" y="155" class="head">2. Simulasi</text><text x="450" y="200" class="body"><tspan x="450" dy="0">Uji sensitivitas dengan</tspan><tspan x="450" dy="30">asumsi yang dinyatakan;</tspan><tspan x="450" dy="30">jangan klaim hasil ukur.</tspan></text><rect x="800" y="110" width="320" height="245" rx="18" class="card amber"/><text x="830" y="155" class="head">3. Tinjauan operator</text><text x="830" y="200" class="body"><tspan x="830" dy="0">Tetapkan batas layanan,</tspan><tspan x="830" dy="30">pengujian, rollback, keamanan,</tspan><tspan x="830" dy="30">dan penanggung jawab.</tspan></text><rect x="1180" y="110" width="280" height="245" rx="18" class="card green"/><text x="1210" y="155" class="head">4. Keputusan</text><text x="1210" y="200" class="body"><tspan x="1210" dy="0">Lanjut hanya setelah</tspan><tspan x="1210" dy="30">bukti, izin, dan nilai</tspan><tspan x="1210" dy="30">disetujui pemilik.</tspan></text><path d="M365 230h48m-10-8 10 8-10 8M745 230h48m-10-8 10 8-10 8M1125 230h48m-10-8 10 8-10 8" fill="none" stroke="#64748b" stroke-width="4"/><rect x="300" y="415" width="900" height="115" rx="18" class="card red"/><text x="750" y="460" text-anchor="middle" class="head">Jika data tidak memadai atau batas keselamatan tidak terpenuhi</text><text x="750" y="495" text-anchor="middle" class="body">Tunda atau hentikan uji; perbaiki rancangan. Tidak ada ekspansi atau klaim dampak.</text><path d="M960 360v35H755v15" fill="none" stroke="#e11d48" stroke-width="3"/></svg>