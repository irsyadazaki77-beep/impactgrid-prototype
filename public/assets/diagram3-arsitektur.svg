<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="t d"><title id="t">Arsitektur konsep ImpactGrid</title><desc id="d">Empat modul usulan dengan status koneksi belum tersedia.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1e293b}.title{font-size:25px;font-weight:800}.head{font-size:17px;font-weight:800}.body{font-size:14px}.muted{fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#3b82f6}.purple{fill:#faf5ff;stroke:#a855f7}.amber{fill:#fffbeb;stroke:#f59e0b}.green{fill:#f0fdf4;stroke:#22c55e}</style><text x="40" y="45" class="title">Arsitektur konsep ImpactGrid · belum terintegrasi dengan sistem operasional</text><g><rect x="40" y="95" width="340" height="400" rx="18" class="card blue"/><text x="65" y="140" class="head">1. Network Data Hub</text><text x="65" y="185" class="body"><tspan x="65" dy="0">Masukan yang diusulkan:</tspan><tspan x="65" dy="29">• Meter dan tagihan</tspan><tspan x="65" dy="29">• Trafik dan kondisi aset</tspan><tspan x="65" dy="29">• Cuaca dan biaya</tspan><tspan x="65" dy="55" class="muted">Akses dan kualitas data</tspan><tspan x="65" dy="24" class="muted">belum tersedia.</tspan></text></g><g><rect x="405" y="95" width="340" height="400" rx="18" class="card purple"/><text x="430" y="140" class="head">2. Scenario Lab</text><text x="430" y="185" class="body"><tspan x="430" dy="0">Membandingkan asumsi:</tspan><tspan x="430" dy="29">• Baseline energi</tspan><tspan x="430" dy="29">• Opsi intervensi</tspan><tspan x="430" dy="29">• Sensitivitas biaya</tspan><tspan x="430" dy="55" class="muted">Keluaran hanya simulasi</tspan><tspan x="430" dy="24" class="muted">jika masukan belum valid.</tspan></text></g><g><rect x="770" y="95" width="340" height="400" rx="18" class="card amber"/><text x="795" y="140" class="head">3. Investment Prioritizer</text><text x="795" y="185" class="body"><tspan x="795" dy="0">Membantu membandingkan:</tspan><tspan x="795" dy="29">• Biaya dan manfaat</tspan><tspan x="795" dy="29">• Kelayakan teknis</tspan><tspan x="795" dy="29">• Batas yang disetujui</tspan><tspan x="795" dy="55" class="muted">Belum menghasilkan ranking</tspan><tspan x="795" dy="24" class="muted">atau keputusan investasi.</tspan></text></g><g><rect x="1135" y="95" width="325" height="400" rx="18" class="card green"/><text x="1160" y="140" class="head">4. ESG Measurement</text><text x="1160" y="185" class="body"><tspan x="1160" dy="0">Mendokumentasikan:</tspan><tspan x="1160" dy="29">• Sumber dan metode</tspan><tspan x="1160" dy="29">• Faktor dan batas emisi</tspan><tspan x="1160" dy="29">• Persetujuan dan audit</tspan><tspan x="1160" dy="55" class="muted">Belum ada reduksi emisi</tspan><tspan x="1160" dy="24" class="muted">yang dapat diklaim.</tspan></text></g><path d="M383 295h18m-7-7 7 7-7 7M748 295h18m-7-7 7 7-7 7M1113 295h18m-7-7 7 7-7 7" fill="none" stroke="#64748b" stroke-width="4"/><text x="40" y="555" class="body muted">Setiap integrasi, rekomendasi, dan akses data memerlukan kajian teknis, keamanan, izin, serta persetujuan pemilik.</text></svg>