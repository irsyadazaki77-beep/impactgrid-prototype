<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="t d"><title id="t">Roadmap bersyarat ImpactGrid</title><desc id="d">Audit, pilot yang diusulkan, dan keputusan ekspansi berdasarkan bukti.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1e293b}.title{font-size:25px;font-weight:800}.head{font-size:19px;font-weight:800}.body{font-size:15px}.muted{fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#3b82f6}.amber{fill:#fffbeb;stroke:#f59e0b}.green{fill:#f0fdf4;stroke:#22c55e}</style><text x="40" y="45" class="title">Roadmap bersyarat: setiap tahap menunggu bukti dan persetujuan</text><rect x="40" y="100" width="445" height="415" rx="20" class="card blue"/><text x="75" y="150" class="head">Tahap 1 · Audit dan desain</text><text x="75" y="195" class="body"><tspan x="75" dy="0">• Validasi meter, tagihan, tarif, dan baseline</tspan><tspan x="75" dy="32">• Konfirmasi aset, akses, vendor, dan biaya</tspan><tspan x="75" dy="32">• Tetapkan indikator dan batas keselamatan</tspan><tspan x="75" dy="32">• Setujui metode evaluasi dan tata kelola</tspan></text><text x="75" y="440" class="body muted">Belum ada keputusan investasi</text><rect x="525" y="100" width="445" height="415" rx="20" class="card amber"/><text x="560" y="150" class="head">Tahap 2 · Pilot yang diusulkan</text><text x="560" y="195" class="body"><tspan x="560" dy="0">• Cakupan rancangan: 40 uji + 10 pembanding</tspan><tspan x="560" dy="32">• Lokasi, periode, dan biaya perlu disepakati</tspan><tspan x="560" dy="32">• Uji hanya setelah izin dan kesiapan terbukti</tspan><tspan x="560" dy="32">• Hentikan jika batas keselamatan dilanggar</tspan></text><text x="560" y="440" class="body muted">Belum dijalankan atau disetujui</text><rect x="1010" y="100" width="445" height="415" rx="20" class="card green"/><text x="1045" y="150" class="head">Tahap 3 · Evaluasi skala</text><text x="1045" y="195" class="body"><tspan x="1045" dy="0">• Hitung ulang biaya, manfaat, dan dampak</tspan><tspan x="1045" dy="32">• Tinjau bukti bersama unit berwenang</tspan><tspan x="1045" dy="32">• Putuskan lanjut, ubah, atau hentikan</tspan><tspan x="1045" dy="32">• Ekspansi hanya jika hasil dan izin memadai</tspan></text><text x="1045" y="440" class="body muted">Skala dan waktunya belum ditetapkan</text><path d="M490 307h26m-8-8 8 8-8 8M975 307h26m-8-8 8 8-8 8" fill="none" stroke="#64748b" stroke-width="4"/></svg>