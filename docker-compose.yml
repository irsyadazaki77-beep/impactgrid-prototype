version: '3.8'

# ==============================================================================
# ImpactGrid On-Premise & Edge Sandbox Stack (Docker Compose)
# Telkomsel Network Operations Center (NOC) & Edge Gateway Testing
# ==============================================================================

services:
  # 1. Core Enterprise Decision & Telemetry Ingestion Engine
  impactgrid-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impactgrid-core-prod
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173
      - DATA_CENTER_PRIMARY=telkom-dc-sentul
      - DATA_CENTER_DR=telkom-dc-surabaya
      - DATA_SOVEREIGNTY_JURISDICTION=ID-PP71-2019
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - telkomsel-net

  # 2. Prometheus Observability Scraper (Telkomsel Grafana NOC Integration)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: impactgrid-prometheus
    restart: always
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - impactgrid-core
    networks:
      - telkomsel-net

networks:
  telkomsel-net:
    driver: bridge
    labels:
      com.telkomsel.environment: "production-sandbox"
